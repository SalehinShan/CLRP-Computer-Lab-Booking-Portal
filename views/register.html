<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Computer Laboratory Resource Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
</head>

<body class="login-body">

    <div class="login-card my-4" style="max-width: 500px;">
        <div class="login-brand text-center">
            <h2>CLRP Portal</h2>
            <p>Create a New Portal Account</p>
        </div>

        <div id="reg-alert" class="alert alert-success py-2 px-3 mb-4 d-none align-items-center gap-2" style="font-size: 0.85rem;" role="alert">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <div id="reg-alert-msg">Account registered successfully!</div>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <!-- Account Role Selection -->
            <div class="mb-4">
                <label class="form-label d-block mb-2 fw-semibold">Register As</label>
                <div class="btn-group w-100 role-selector-group" role="group">
                    <input type="radio" class="btn-check" name="role" id="role_student" value="student" checked onchange="toggleRoleFields()">
                    <label class="btn btn-outline-secondary py-2" for="role_student">
                        <i class="bi bi-person-badge me-1"></i> Student
                    </label>

                    <input type="radio" class="btn-check" name="role" id="role_technician" value="technician" onchange="toggleRoleFields()">
                    <label class="btn btn-outline-secondary py-2" for="role_technician">
                        <i class="bi bi-tools me-1"></i> Technician
                    </label>

                    <input type="radio" class="btn-check" name="role" id="role_admin" value="admin" onchange="toggleRoleFields()">
                    <label class="btn btn-outline-secondary py-2" for="role_admin">
                        <i class="bi bi-shield-lock me-1"></i> Admin
                    </label>
                </div>
            </div>

            <!-- Full Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Md. Abu Salehin Shan" required autofocus>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="user@northsouth.edu" required>
            </div>

            <!-- Student Specific Fields -->
            <div id="student-fields" class="role-fields">
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label for="student_id" class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="student_id" name="student_id" placeholder="e.g. 2111001042">
                    </div>
                    <div class="col-md-6">
                        <label for="dept_id" class="form-label">Department</label>
                        <select class="form-select" id="dept_id" name="dept_id">
                            <option value="ECE">ECE - Electrical & Computer Engineering</option>
                            <option value="CSE">CSE - Computer Science & Engineering</option>
                            <option value="EEE">EEE - Electrical & Electronic Engineering</option>
                            <option value="CEE">CEE - Civil & Environmental Engineering</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Technician Specific Fields -->
            <div id="technician-fields" class="role-fields" style="display: none;">
                <div class="mb-3">
                    <label for="specialization" class="form-label">Technician Specialization</label>
                    <select class="form-select" id="specialization" name="specialization">
                        <option value="Hardware">Hardware Maintenance</option>
                        <option value="Networking">Networking & Infrastructure</option>
                        <option value="Software">Software & Applications</option>
                        <option value="Operating Systems">Operating Systems & Drivers</option>
                    </select>
                </div>
            </div>

            <!-- Password Fields -->
            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-clrp w-100 py-2.5 mb-3">
                <i class="bi bi-person-plus-fill me-1"></i> Register Account
            </button>
        </form>

        <div class="text-center pt-3 border-top border-secondary-subtle" style="font-size: 0.875rem;">
            <span class="text-secondary">Already have a portal account?</span>
            <a href="login.html" class="text-primary font-semibold text-decoration-none ms-1">
                Sign In <i class="bi bi-arrow-right-short"></i>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleRoleFields() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const studentFields = document.getElementById('student-fields');
            const techFields = document.getElementById('technician-fields');
            const studentIdInput = document.getElementById('student_id');

            if (role === 'student') {
                studentFields.style.display = 'block';
                techFields.style.display = 'none';
                studentIdInput.setAttribute('required', 'required');
            } else if (role === 'technician') {
                studentFields.style.display = 'none';
                techFields.style.display = 'block';
                studentIdInput.removeAttribute('required');
            } else {
                studentFields.style.display = 'none';
                techFields.style.display = 'none';
                studentIdInput.removeAttribute('required');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            const alertBox = document.getElementById('reg-alert');
            const alertMsg = document.getElementById('reg-alert-msg');

            alertBox.className = "alert alert-success py-2 px-3 mb-4 d-flex align-items-center gap-2";
            alertMsg.innerText = `Account created successfully as ${role.toUpperCase()}! Redirecting...`;

            setTimeout(() => {
                if (role === 'admin') window.location.href = 'admin/dashboard.html';
                else if (role === 'technician') window.location.href = 'technician/dashboard.html';
                else window.location.href = 'student/dashboard.html';
            }, 800);
        }

        document.addEventListener('DOMContentLoaded', toggleRoleFields);
    </script>
</body>

</html>
