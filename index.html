<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Computer Laboratory Resource Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body class="login-body">

    <div class="login-card">
        <div class="login-brand text-center">
            <h2>CLRP Portal</h2>
            <p>Computer Laboratory Resource Portal</p>
        </div>

        <div id="login-alert" class="alert alert-info py-2 px-3 mb-4 d-none align-items-center gap-2" style="font-size: 0.85rem;" role="alert">
            <i class="bi bi-info-circle-fill flex-shrink-0"></i>
            <div id="login-alert-msg">Logging in...</div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" value="abu.shan.241@northsouth.edu"
                    placeholder="user@northsouth.edu" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" value="password123" placeholder="••••••••"
                    required>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label">Portal Account Type</label>
                <select class="form-select" id="role" name="role">
                    <option value="auto">Auto-Detect Portal Role</option>
                    <option value="student" selected>Student</option>
                    <option value="technician">Technician</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary-clrp w-100 py-2.5 mb-3">
                Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="text-center pt-3 mb-3 border-top border-secondary-subtle" style="font-size: 0.875rem;">
            <span class="text-secondary">Don't have a portal account?</span>
            <a href="views/register.html" class="text-primary font-semibold text-decoration-none ms-1">
                Create an Account <i class="bi bi-person-plus"></i>
            </a>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary-subtle demo-accounts-box">
            <div class="fw-semibold text-light-emphasis mb-2 d-flex align-items-center gap-1">
                <i class="bi bi-shield-lock-fill text-primary"></i> Demo Quick Accounts (Click to auto-fill):
            </div>
            <div class="demo-acc-item role-clickable p-2 mb-1 border rounded" style="cursor: pointer; background: rgba(255,255,255,0.03);" onclick="fillDemo('admin.sys@northsouth.edu', 'password123', 'admin')">
                <i class="bi bi-shield-check text-warning me-1"></i> <strong>Admin:</strong> admin.sys@northsouth.edu
            </div>
            <div class="demo-acc-item role-clickable p-2 mb-1 border rounded" style="cursor: pointer; background: rgba(255,255,255,0.03);" onclick="fillDemo('kamrul.hasan@northsouth.edu', 'password123', 'technician')">
                <i class="bi bi-tools text-info me-1"></i> <strong>Technician:</strong> kamrul.hasan@northsouth.edu
            </div>
            <div class="demo-acc-item role-clickable p-2 mb-1 border rounded" style="cursor: pointer; background: rgba(255,255,255,0.03);" onclick="fillDemo('abu.shan.241@northsouth.edu', 'password123', 'student')">
                <i class="bi bi-person-badge text-primary me-1"></i> <strong>Student:</strong> abu.shan.241@northsouth.edu
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillDemo(email, password, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('role').value = role;
            
            const alertBox = document.getElementById('login-alert');
            const alertMsg = document.getElementById('login-alert-msg');
            alertBox.className = "alert alert-success py-2 px-3 mb-4 d-flex align-items-center gap-2";
            alertMsg.innerText = `Auto-filled demo account for ${role.toUpperCase()}. Click Sign In to continue!`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.toLowerCase();
            let role = document.getElementById('role').value;

            if (role === 'auto') {
                if (email.includes('admin')) role = 'admin';
                else if (email.includes('kamrul') || email.includes('tech')) role = 'technician';
                else role = 'student';
            }

            const alertBox = document.getElementById('login-alert');
            const alertMsg = document.getElementById('login-alert-msg');
            alertBox.className = "alert alert-info py-2 px-3 mb-4 d-flex align-items-center gap-2";
            alertMsg.innerText = "Signing in... Redirecting to portal dashboard.";

            setTimeout(() => {
                if (role === 'admin') {
                    window.location.href = 'views/admin/dashboard.html';
                } else if (role === 'technician') {
                    window.location.href = 'views/technician/dashboard.html';
                } else {
                    window.location.href = 'views/student/dashboard.html';
                }
            }, 600);
        }
    </script>
</body>

</html>
